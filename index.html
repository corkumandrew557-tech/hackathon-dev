<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass OS - Core Interface Panel</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-blue: #58a6ff;
            --status-green: #2ea44f;
            --alert-red: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-blue);
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .metric-label {
            font-weight: 600;
        }
        .metric-value {
            font-family: monospace;
            color: var(--status-green);
        }
        .control-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
        }
        .control-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Compass OS Matrix Terminal</h1>
    
    <div class="metric-row">
        <span class="metric-label">System Gateway Status</span>
        <span class="metric-value" id="systemStatus">CHECKING...</span>
    </div>
    <div class="metric-row">
        <span class="metric-label">System Uptime</span>
        <span class="metric-value" id="systemUptime">0s</span>
    </div>
    <div class="metric-row">
        <span class="metric-label">Data Packets Processed</span>
        <span class="metric-value" id="requestCount">0 Packets</span>
    </div>
    
    <button class="control-btn" onclick="refreshMetrics()">Query Real-Time Metrics</button>
</div>

<script>
    // Define the gateway network target
    const API_URL = "http://localhost:3000/api/status";

    function refreshMetrics() {
        const statusEl = document.getElementById('systemStatus');
        const uptimeEl = document.getElementById('systemUptime');
        const countEl = document.getElementById('requestCount');

        statusEl.innerText = "QUERYING...";
        statusEl.style.color = "var(--accent-blue)";

        // AJAX Fetch Request Loop to hook up to the backend server
        fetch(API_URL)
            .then(response => {
                if (!response.ok) throw new Error("Network response mismatch.");
                return response.json();
            })
            .then(data => {
                if (data.status === "SUCCESS") {
                    statusEl.innerText = data.metrics.status;
                    statusEl.style.color = "var(--status-green)";
                    uptimeEl.innerText = data.metrics.uptime;
                    countEl.innerText = data.metrics.processedRequests + " Packets";
                }
            })
            .catch(err => {
                statusEl.innerText = "OFFLINE";
                statusEl.style.color = "var(--alert-red)";
                console.error("Gateway connection error:", err);
            });
    }

    // Auto-query once right away on screen boot
    window.onload = refreshMetrics;
</script>

</body>
</html>

<script>
    function refreshMetrics() {
        // Front-end UI action state placeholder

        let currentCount = parseInt(countEl.innerText) || 0;
        countEl.innerText = (currentCount + 1) + ' Packets';
    }
